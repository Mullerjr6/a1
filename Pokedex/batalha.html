<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batalha Pokemon TCG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="battle-page">
  <main class="battle-arena-page">
    <header class="battle-header">
      <a class="btn secondary" href="index.html#arena">Voltar</a>
      <div>
        <p class="eyebrow">Arena Pokemon</p>
        <h1>Batalha em andamento</h1>
      </div>
      <button class="btn danger" id="battleReset">Encerrar</button>
    </header>

    <section class="pokemon-battlefield" id="battlefield">
      <div class="battle-hud enemy-hud">
        <span id="enemyTrainer">Oponente</span>
        <strong><b id="enemyLpBattle">4000</b> LP</strong>
      </div>

      <div class="battle-hud player-hud">
        <span>Treinador</span>
        <strong><b id="playerLpBattle">4000</b> LP</strong>
      </div>

      <section class="battle-card-zone enemy-card-zone">
        <div class="battle-corner-label">Inimigo</div>
        <div id="enemyBattleCard"></div>
        <div class="battle-team-row" id="enemyBattleTeam"></div>
      </section>

      <section class="battle-card-zone player-card-zone">
        <div class="battle-team-row" id="playerBattleTeam"></div>
        <div id="playerBattleCard"></div>
        <div class="battle-corner-label">Sua carta</div>
      </section>

      <div class="battle-effects" id="battleEffects"></div>

      <section class="battle-command glass">
        <div>
          <p class="eyebrow" id="turnBattle">Seu turno</p>
          <h2 id="battleTitle">Escolha um ataque</h2>
          <p id="battleNarration">A arena esta pronta.</p>
        </div>
        <div class="battle-powers">
          <span>Seu poder <b id="playerPowerBattle">0</b></span>
          <span>Poder rival <b id="enemyPowerBattle">0</b></span>
        </div>
        <div class="battle-actions" id="battleActions"></div>
      </section>

      <section class="battle-log-card glass">
        <h3>Registro</h3>
        <div id="battleHistory"></div>
      </section>

      <section class="battle-result-screen hidden" id="battleResult">
        <p class="eyebrow" id="battleResultEye">Fim</p>
        <h2 id="battleResultTitle">Resultado</h2>
        <p id="battleResultText"></p>
        <div class="hero-actions">
          <a class="btn" href="index.html#arena">Nova batalha</a>
          <a class="btn secondary" href="index.html#colecao">Colecao</a>
        </div>
      </section>
    </section>
  </main>

  <script src="batalha.js"></script>
</body>
</html>
